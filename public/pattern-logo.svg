  <!-- Wordmark PATTERN -->
  <g transform="translate(250, 310)" text-anchor="middle">
    <!-- P -->
    <text x="-160" y="0" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="44" font-weight="900" fill="#F1EBE6" letter-spacing="6">P</text>
    <!-- A -->
    <text x="-95" y="0" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="44" font-weight="900" fill="#F1EBE6" letter-spacing="6">A</text>
    <!-- T -->
    <text x="-32" y="0" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="44" font-weight="900" fill="#F1EBE6" letter-spacing="6">T</text>
    <!-- T -->
    <text x="32" y="0" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="44" font-weight="900" fill="#F1EBE6" letter-spacing="6">T</text>
    <!-- E with Gold Bar -->
    <rect x="83" y="-38" width="30" height="4" fill="#F26522" rx="2" />
    <text x="96" y="0" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="44" font-weight="900" fill="#F1EBE6" letter-spacing="6">E</text>
    <!-- R -->
    <text x="155" y="0" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="44" font-weight="900" fill="#F1EBE6" letter-spacing="6">R</text>
    <!-- N -->
    <text x="215" y="0" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="44" font-weight="900" fill="#F1EBE6" letter-spacing="6">N</text>
  </g>

  <!-- Tagline -->
  <g transform="translate(250, 360)" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="3">
    <text fill="#8A8582">
      SEE WHAT <tspan fill="#F26522">REPEATS</tspan>. UNDERSTAND <tspan fill="#F26522">WHY</tspan>. PREDICT WHAT COMES <tspan fill="#F26522">NEXT</tspan>.
    </text>
  </g>
</svg>
