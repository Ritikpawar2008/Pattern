    <circle cx="28" cy="109" r="1.8" fill="#F26522" opacity="0.35" />
    <circle cx="41" cy="109" r="2.2" fill="#F89225" opacity="0.55" />
    <circle cx="54" cy="109" r="2.6" fill="#FFB347" opacity="0.7" />
    <circle cx="67" cy="109" r="3.0" fill="#FFB347" opacity="0.85" />
