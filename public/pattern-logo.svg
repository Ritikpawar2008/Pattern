    <path d="M 67 38 Q 88 38 108 38" stroke="url(#fullPLineGrad)" stroke-width="1.5" fill="none" stroke-linecap="round" />

    <circle cx="15" cy="49" r="1.5" fill="#F26522" opacity="0.3" />
    <circle cx="28" cy="49" r="1.8" fill="#F26522" opacity="0.5" />
