<svg viewBox="0 0 500 500" width="500" height="500" xmlns="http://www.w3.org/2000/svg">
  <rect width="500" height="500" fill="#000000" />
  <defs>
    <linearGradient id="fullPGoldGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stopColor="#FFF2D6" />
      <stop offset="25%" stopColor="#FFB347" />
      <stop offset="50%" stopColor="#F26522" />
      <stop offset="85%" stopColor="#D34607" />
      <stop offset="100%" stopColor="#8A2500" />
    </linearGradient>
    <linearGradient id="fullPStemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#F26522" />
      <stop offset="50%" stopColor="#FFF0DC" />
      <stop offset="100%" stopColor="#FFFFFF" />
    </linearGradient>
    <linearGradient id="fullPLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#F26522" stopOpacity="0.2" />
      <stop offset="50%" stopColor="#F89225" stopOpacity="0.7" />
      <stop offset="100%" stopColor="#FFF2D6" stopOpacity="1" />
    </linearGradient>
    <filter id="fullPGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

