    <circle cx="15" cy="133" r="1.5" fill="#F26522" opacity="0.1" />
    <circle cx="28" cy="133" r="1.8" fill="#F26522" opacity="0.2" />
    <circle cx="41" cy="133" r="2.0" fill="#F89225" opacity="0.35" />
