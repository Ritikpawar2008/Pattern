        C 105 38, 120 40, 138 48
        C 160 58, 172 78, 172 98
        C 172 122, 156 142, 130 148
        C 114 152, 102 152, 94 152
        L 94 106
        C 102 106, 114 106, 124 103
        C 136 100, 144 90, 144 78
        C 144 64, 134 54, 118 52
        C 104 50, 94 54, 85 58
